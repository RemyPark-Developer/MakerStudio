name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 설계서 §6.3 "2단계 자동 검증" — content/examples/*.json 스키마 검사.
      - name: Validate content (content/examples/*.json)
        run: npm run validate-content

      # §6.3의 실제 구현 — 진짜 avr-gcc + Arduino 코어로 컴파일 검증합니다.
      # AI가 만든 코드에 존재하지 않는 함수나 잘못된 핀 번호가 있으면 여기서 걸러집니다.
      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr arduino-core-avr

      - name: Compile-check Arduino code (real avr-gcc)
        run: npm run validate-arduino

      - name: Type-check & build
        run: npm run build

  # content/** 경로만 바뀐 PR(=AI가 생성한 콘텐츠 모듈)에는 이 라벨을 붙여
  # "사람 검수" 단계로 넘어갈 대상을 쉽게 구분할 수 있습니다.
  label-content-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
